# 运行时模型配置 —— 换模型只改这个文件（配合 src/resume_system/llm/factory.py）
provider: deepseek            # 目前只有 deepseek；新增见 factory.py
model: deepseek-chat          # 官方模型名：deepseek-chat / deepseek-reasoner
base_url: https://api.deepseek.com   # DeepSeek 官方 OpenAI 兼容端点；若是私有/中转网关改成你的地址
api_key_env: DEEPSEEK_API_KEY        # API key 从环境变量读取，不要写死在这里
temperature: 0.3
max_tokens: 8192
